name: Prepare production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to prepare the production containers
        required: true
        type: string

concurrency:
  group: dutchvacancy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      VPS_HOST: 85.10.151.123
      VPS_USER: deploy

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          test -n "$VPS_SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for attempt in $(seq 1 60); do
            if ssh-keyscan -T 5 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            sleep 10
          done
          test -s ~/.ssh/known_hosts

      - name: Upload application
        run: |
          ssh "$VPS_USER@$VPS_HOST" 'sudo install -d -o "$USER" -g "$USER" /opt/dutchvacancy-production'
          tar \
            --exclude=.git \
            --exclude=.venv \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=__pycache__ \
            --exclude=.pytest_cache \
            -czf - . \
          | ssh "$VPS_USER@$VPS_HOST" 'tar -xzf - -C /opt/dutchvacancy-production'

      - name: Configure production secrets
        env:
          PRODUCTION_RESEND_API_KEY: ${{ secrets.PRODUCTION_RESEND_API_KEY }}
          PRODUCTION_STRIPE_SECRET_KEY: ${{ secrets.PRODUCTION_STRIPE_SECRET_KEY }}
          PRODUCTION_STRIPE_WEBHOOK_SECRET: ${{ secrets.PRODUCTION_STRIPE_WEBHOOK_SECRET }}
        run: |
          test -n "$PRODUCTION_RESEND_API_KEY"
          resend_file="$RUNNER_TEMP/dutchvacancy-production-resend-api-key"
          stripe_file="$RUNNER_TEMP/dutchvacancy-production-stripe-secret-key"
          webhook_file="$RUNNER_TEMP/dutchvacancy-production-stripe-webhook-secret"
          umask 077
          printf '%s\n' "$PRODUCTION_RESEND_API_KEY" > "$resend_file"
          printf '%s\n' "$PRODUCTION_STRIPE_SECRET_KEY" > "$stripe_file"
          printf '%s\n' "$PRODUCTION_STRIPE_WEBHOOK_SECRET" > "$webhook_file"
          scp "$resend_file" "$stripe_file" "$webhook_file" "$VPS_USER@$VPS_HOST:/tmp/"
          shred -u "$resend_file" "$stripe_file" "$webhook_file"

          ssh "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
            set -euo pipefail
            resend_api_key="$(cat /tmp/dutchvacancy-production-resend-api-key)"
            stripe_secret_key="$(cat /tmp/dutchvacancy-production-stripe-secret-key)"
            stripe_webhook_secret="$(cat /tmp/dutchvacancy-production-stripe-webhook-secret)"
            shred -u \
              /tmp/dutchvacancy-production-resend-api-key \
              /tmp/dutchvacancy-production-stripe-secret-key \
              /tmp/dutchvacancy-production-stripe-webhook-secret
            cd /opt/dutchvacancy-production

            if [ ! -f .env.production ]; then
              umask 077
              mongo_password="$(openssl rand -hex 32)"
              cat > .env.production <<ENV
          MONGO_ROOT_USERNAME=dutchvacancy
          MONGO_ROOT_PASSWORD=${mongo_password}
          DB_NAME=dutchvacancy
          ENV
            fi

            temporary_env="$(mktemp)"
            grep -Ev '^(APP_URL|CORS_ORIGINS|RESEND_API_KEY|EMAIL_FROM|STRIPE_SECRET_KEY|STRIPE_WEBHOOK_SECRET)=' .env.production > "$temporary_env"
            {
              printf '%s\n' 'APP_URL=https://dutchvacancy.nl'
              printf '%s\n' 'CORS_ORIGINS=https://dutchvacancy.nl,https://www.dutchvacancy.nl'
              printf 'RESEND_API_KEY=%s\n' "$resend_api_key"
              printf '%s\n' "EMAIL_FROM='DutchVacancy <noreply@dutchvacancy.nl>'"
              printf 'STRIPE_SECRET_KEY=%s\n' "$stripe_secret_key"
              printf 'STRIPE_WEBHOOK_SECRET=%s\n' "$stripe_webhook_secret"
            } >> "$temporary_env"
            mv "$temporary_env" .env.production
            chmod 600 .env.production
          REMOTE

      - name: Build private production candidate
        run: |
          ssh "$VPS_USER@$VPS_HOST" 'bash -s' <<REMOTE
            set -euo pipefail
            cd /opt/dutchvacancy-production
            sudo docker compose \
              --project-name dutchvacancy-production \
              --env-file .env.production \
              -f compose.production.yml \
              up -d --build

            for attempt in \$(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:8180/healthz >/dev/null; then
                curl --fail --silent http://127.0.0.1:8180/api/status >/dev/null
                printf '%s\n' '${{ github.sha }}' > .deployed-commit
                sudo docker compose \
                  --project-name dutchvacancy-production \
                  --env-file .env.production \
                  -f compose.production.yml \
                  ps
                exit 0
              fi
              sleep 5
            done

            sudo docker compose \
              --project-name dutchvacancy-production \
              --env-file .env.production \
              -f compose.production.yml \
              logs --tail=100
            exit 1
          REMOTE

      - name: Show deployment diagnostics
        if: failure()
        run: |
          ssh "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
            cd /opt/dutchvacancy-production
            sudo docker compose \
              --project-name dutchvacancy-production \
              --env-file .env.production \
              -f compose.production.yml \
              ps || true
            sudo docker compose \
              --project-name dutchvacancy-production \
              --env-file .env.production \
              -f compose.production.yml \
              logs --tail=150 || true
          REMOTE

