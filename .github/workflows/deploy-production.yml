name: Prepare production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to prepare the production containers
        required: true
        type: string

concurrency:
  group: dutchvacancy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      VPS_HOST: 85.10.151.123
      VPS_USER: deploy
      RELEASE_PATH: /opt/dutchvacancy-production/releases/${{ github.sha }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate production contact and company details
        env:
          CONTACT_NOTIFICATION_EMAIL: ${{ vars.CONTACT_NOTIFICATION_EMAIL || 'info@dutchvacancy.nl' }}
        run: node scripts/check-production-readiness.mjs

      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          test -n "$VPS_SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for attempt in $(seq 1 60); do
            if ssh-keyscan -T 5 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            sleep 10
          done
          test -s ~/.ssh/known_hosts

      - name: Upload application
        run: |
          ssh "$VPS_USER@$VPS_HOST" \
            "sudo install -d -o \"\$USER\" -g \"\$USER\" /opt/dutchvacancy-production /opt/dutchvacancy-production/releases /opt/dutchvacancy-production/backups && install -d '$RELEASE_PATH'"
          tar \
            --exclude=.git \
            --exclude=.venv \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=__pycache__ \
            --exclude=.pytest_cache \
            -czf - . \
          | ssh "$VPS_USER@$VPS_HOST" "tar -xzf - -C '$RELEASE_PATH'"

      - name: Configure production secrets
        env:
          PRODUCTION_RESEND_API_KEY: ${{ secrets.PRODUCTION_RESEND_API_KEY }}
          PRODUCTION_STRIPE_SECRET_KEY: ${{ secrets.PRODUCTION_STRIPE_SECRET_KEY }}
          PRODUCTION_STRIPE_WEBHOOK_SECRET: ${{ secrets.PRODUCTION_STRIPE_WEBHOOK_SECRET }}
          CONTACT_NOTIFICATION_EMAIL: ${{ vars.CONTACT_NOTIFICATION_EMAIL || 'info@dutchvacancy.nl' }}
        run: |
          test -n "$PRODUCTION_RESEND_API_KEY"
          resend_file="$RUNNER_TEMP/dutchvacancy-production-resend-api-key"
          stripe_file="$RUNNER_TEMP/dutchvacancy-production-stripe-secret-key"
          webhook_file="$RUNNER_TEMP/dutchvacancy-production-stripe-webhook-secret"
          contact_file="$RUNNER_TEMP/dutchvacancy-production-contact-email"
          umask 077
          printf '%s\n' "$PRODUCTION_RESEND_API_KEY" > "$resend_file"
          printf '%s\n' "$PRODUCTION_STRIPE_SECRET_KEY" > "$stripe_file"
          printf '%s\n' "$PRODUCTION_STRIPE_WEBHOOK_SECRET" > "$webhook_file"
          printf '%s\n' "$CONTACT_NOTIFICATION_EMAIL" > "$contact_file"
          scp "$resend_file" "$stripe_file" "$webhook_file" "$contact_file" "$VPS_USER@$VPS_HOST:/tmp/"
          shred -u "$resend_file" "$stripe_file" "$webhook_file" "$contact_file"

          ssh "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
            set -euo pipefail
            resend_api_key="$(cat /tmp/dutchvacancy-production-resend-api-key)"
            stripe_secret_key="$(cat /tmp/dutchvacancy-production-stripe-secret-key)"
            stripe_webhook_secret="$(cat /tmp/dutchvacancy-production-stripe-webhook-secret)"
            contact_email="$(cat /tmp/dutchvacancy-production-contact-email)"
            shred -u /tmp/dutchvacancy-production-contact-email
            shred -u \
              /tmp/dutchvacancy-production-resend-api-key \
              /tmp/dutchvacancy-production-stripe-secret-key \
              /tmp/dutchvacancy-production-stripe-webhook-secret
            cd /opt/dutchvacancy-production

            if [ ! -f .env.production ]; then
              umask 077
              mongo_password="$(openssl rand -hex 32)"
              cat > .env.production <<ENV
          MONGO_ROOT_USERNAME=dutchvacancy
          MONGO_ROOT_PASSWORD=${mongo_password}
          DB_NAME=dutchvacancy
          ENV
            fi

            temporary_env="$(mktemp)"
            grep -Ev '^(APP_URL|CORS_ORIGINS|RESEND_API_KEY|EMAIL_FROM|CONTACT_NOTIFICATION_EMAIL|STRIPE_SECRET_KEY|STRIPE_WEBHOOK_SECRET)=' .env.production > "$temporary_env"
            {
              printf '%s\n' 'APP_URL=https://dutchvacancy.nl'
              printf '%s\n' 'CORS_ORIGINS=https://dutchvacancy.nl,https://www.dutchvacancy.nl'
              printf 'RESEND_API_KEY=%s\n' "$resend_api_key"
              printf 'CONTACT_NOTIFICATION_EMAIL=%s\n' "$contact_email"
              printf '%s\n' "EMAIL_FROM='DutchVacancy <noreply@dutchvacancy.nl>'"
              printf 'STRIPE_SECRET_KEY=%s\n' "$stripe_secret_key"
              printf 'STRIPE_WEBHOOK_SECRET=%s\n' "$stripe_webhook_secret"
            } >> "$temporary_env"
            mv "$temporary_env" .env.production
            chmod 600 .env.production
          REMOTE

      - name: Build private production candidate
        run: |
          ssh "$VPS_USER@$VPS_HOST" bash -s -- "$RELEASE_PATH" '${{ github.sha }}' <<'REMOTE'
            set -euo pipefail
            release_path="$1"
            commit_sha="$2"
            base_dir=/opt/dutchvacancy-production
            env_file="$base_dir/.env.production"
            previous_release="$(readlink -f "$base_dir/current" 2>/dev/null || true)"

            if [ -x "$base_dir/current/scripts/backup-production.sh" ]; then
              "$base_dir/current/scripts/backup-production.sh"
            fi

            if [ -e "$base_dir/current" ] && [ ! -L "$base_dir/current" ]; then
              echo "Refusing to replace a non-symlink production current path."
              exit 1
            fi
            ln -sfn "$release_path" "$base_dir/current"
            cd "$base_dir/current"

            if ! sudo docker compose \
              --project-name dutchvacancy-production \
              --env-file "$env_file" \
              -f compose.production.yml \
              up -d --build; then
              if [ -n "$previous_release" ]; then
                ln -sfn "$previous_release" "$base_dir/current"
              fi
              exit 1
            fi

            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:8180/healthz >/dev/null; then
                curl --fail --silent http://127.0.0.1:8180/api/status >/dev/null
                printf '%s\n' "$commit_sha" > "$base_dir/.deployed-commit"
                sudo docker compose \
                  --project-name dutchvacancy-production \
                  --env-file "$env_file" \
                  -f compose.production.yml \
                  ps
                find "$base_dir/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
                  | sort -nr \
                  | awk 'NR > 5 {sub(/^[^ ]+ /, ""); print}' \
                  | xargs -r rm -rf
                exit 0
              fi
              sleep 5
            done

            if [ -n "$previous_release" ]; then
              ln -sfn "$previous_release" "$base_dir/current"
              cd "$base_dir/current"
              sudo docker compose \
                --project-name dutchvacancy-production \
                --env-file "$env_file" \
                -f compose.production.yml \
                up -d --build || true
            fi
            sudo docker compose \
              --project-name dutchvacancy-production \
              --env-file "$env_file" \
              -f compose.production.yml \
              logs --tail=100
            exit 1
          REMOTE

      - name: Show deployment diagnostics
        if: failure()
        run: |
          ssh "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
            cd /opt/dutchvacancy-production/current
            sudo docker compose \
              --project-name dutchvacancy-production \
              --env-file /opt/dutchvacancy-production/.env.production \
              -f compose.production.yml \
              ps || true
            sudo docker compose \
              --project-name dutchvacancy-production \
              --env-file /opt/dutchvacancy-production/.env.production \
              -f compose.production.yml \
              logs --tail=150 || true
          REMOTE
