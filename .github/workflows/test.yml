name: Test application
on:
  push:
    branches: [main, codex/production-prep, codex/launch-readiness]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-test.txt
      - run: python -m pytest backend/tests
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})' --quiet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # An isolated, disposable database for this CI run only — never staging/production.
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: dutchvacancy_e2e
      APP_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      DISABLE_RATE_LIMITS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start backend
        working-directory: backend
        run: |
          pip install -r requirements-production.txt
          nohup uvicorn server:app --host 0.0.0.0 --port 8001 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8001/api/status > /dev/null && exit 0
            sleep 1
          done
          echo "Backend failed to start"; cat /tmp/backend.log; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Start frontend dev server
        working-directory: frontend
        run: |
          npm ci
          nohup npm run dev -- --port 3000 --host > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000 > /dev/null && exit 0
            sleep 1
          done
          echo "Frontend failed to start"; cat /tmp/frontend.log; exit 1

      - name: Install Playwright
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: tests
        run: npx playwright test --project=desktop

      - name: Show server logs on failure
        if: failure()
        run: |
          echo "--- backend ---"; cat /tmp/backend.log || true
          echo "--- frontend ---"; cat /tmp/frontend.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/test-results
          retention-days: 7
